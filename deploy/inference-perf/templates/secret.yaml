# inference-perf/templates/secret.yaml
{{- if or .Values.hfToken .Values.hfSecret }}
{{- fail "top-level hfToken and hfSecret are not read; use token.hfToken or token.hfSecret.name and token.hfSecret.key" }}
{{- end }}
{{- if .Values.token.hfToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inference-perf.hfSecret" . }}
  labels:
    {{- include "inference-perf.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "inference-perf.hfKey" . }}: {{ .Values.token.hfToken | quote }}
{{- end }}
