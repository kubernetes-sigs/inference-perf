absorber:
  ttft_ms: 40
  itl_ms: 3
workload:
  num_requests: 48
  prompt_tokens: 128
  prompt_tokens_rel_tol: 0.15
  max_tokens: 64
  stream: true
  ignore_eos: true
load:
  mode: concurrency
  concurrency: 8
tools:
  vllm-bench:
    # vllm bench always sends one test request before the real run; it is
    # ignored. See a_fixed_rate/expected.yaml.
    leading_extra_requests: 1
