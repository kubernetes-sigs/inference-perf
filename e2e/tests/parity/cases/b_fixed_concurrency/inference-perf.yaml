# Closed loop: exactly 8 in flight until 48 requests complete, 128-in / 64-out.
# server.base_url and tokenizer path are overwritten by the parity harness.
api:
  type: completion
  streaming: true
data:
  type: random
  input_distribution:
    type: fixed
    min: 128
    max: 128
    mean: 128
    total_count: 64
  output_distribution:
    type: fixed
    min: 64
    max: 64
    mean: 64
    total_count: 64
load:
  type: concurrent
  stages:
    - num_requests: 48
      concurrency_level: 8
  num_workers: 8
server:
  type: vllm
  model_name: google/gemma-3-270m
  base_url: http://127.0.0.1:8000
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: google/gemma-3-270m
report:
  request_lifecycle:
    summary: true
    per_stage: false
    per_request: false
