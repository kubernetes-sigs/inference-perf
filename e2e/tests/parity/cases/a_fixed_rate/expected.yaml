absorber:
  ttft_ms: 40
  itl_ms: 3
workload:
  num_requests: 600
  prompt_tokens: 128
  prompt_tokens_rel_tol: 0.15
  max_tokens: 64
  stream: true
  ignore_eos: true
load:
  mode: rate
  rate: 40.0
  # There is no rate tolerance number here on purpose. How far each tool's
  # measured rate may sit from 40/s comes from rate_tolerance(num_requests,
  # arrival) in e2e/utils/load_shape.py, using the spacing pattern each tool
  # declares under tools.<tool>.arrival below. At 600 requests that is 5% for
  # `constant` (38.0 to 42.0/s) and about 16% for `poisson` (33.5 to 46.5/s,
  # four standard deviations, so a correct tool fails by bad luck less than
  # once in 10,000 runs). To tighten it, raise num_requests: the poisson
  # wobble shrinks with the square root of the request count. There is no
  # number to loosen.
tools:
  inference-perf:
    # inference-perf's `constant` load draws random gaps, then scales them to
    # add up to exactly the stage duration.
    arrival: constant
  vllm-bench:
    # vllm bench spaces requests randomly (Poisson) at any --request-rate.
    arrival: poisson
    # No leading_extra_requests: at the pinned version benchmark() in
    # vllm/benchmarks/serve.py sends its test request only when
    # --ready-check-timeout-sec is above 0 and its warmups only when
    # --num-warmups is, and both default to 0. So the absorber records exactly
    # num_requests.
    # No prompt_outlier_frac either: the pinned sampler re-encodes each random
    # prompt and pads or trims it until it hits the target token count (up to
    # 10 tries, gen_prompt_decode_to_target_len), so the round-trip collapses
    # that needed a 1% allowance at v0.10.0 are corrected. A run at the default
    # --seed 0 put all 600 prompts inside 128 +-15%.
