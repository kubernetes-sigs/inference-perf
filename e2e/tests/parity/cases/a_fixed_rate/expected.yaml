absorber:
  ttft_ms: 40
  itl_ms: 3
workload:
  num_requests: 600
  prompt_tokens: 128
  prompt_tokens_rel_tol: 0.15
  max_tokens: 64
  stream: true
  ignore_eos: true
load:
  mode: rate
  rate: 40.0
  # There is no rate tolerance number here on purpose. How far each tool's
  # measured rate may sit from 40/s comes from rate_tolerance(num_requests,
  # arrival) in e2e/utils/load_shape.py, using the spacing pattern each tool
  # declares under tools.<tool>.arrival below. At 600 requests that is 5% for
  # `constant` (38.0 to 42.0/s) and about 16% for `poisson` (33.5 to 46.5/s,
  # four standard deviations, so a correct tool fails by bad luck less than
  # once in 10,000 runs). To tighten it, raise num_requests: the poisson
  # wobble shrinks with the square root of the request count. There is no
  # number to loosen.
tools:
  inference-perf:
    # inference-perf's `constant` load draws random gaps, then scales them to
    # add up to exactly the stage duration.
    arrival: constant
  vllm-bench:
    # vllm bench spaces requests randomly (Poisson) at any --request-rate.
    arrival: poisson
    # vllm bench always sends one test request before the real run (there is
    # no flag to turn it off at the pinned version; see benchmark() in its
    # vllm/benchmarks/serve.py), then sends all --num-prompts requests. So the
    # absorber records num_requests + 1, and the first one is ignored.
    leading_extra_requests: 1
    # vllm bench builds each random prompt from consecutive token ids, then
    # decodes and re-encodes it. A few id ranges in the gemma tokenizer
    # (<unusedN>, control characters) collapse under that round trip, down to
    # 17 tokens. Replaying the pinned sampler for these 600 prompts gives none
    # at the default --seed 0 and 1 or 2 at seeds 1 to 4. So up to 1% of its
    # prompts may miss the 128 +-15% bound. inference-perf declares nothing
    # here, so every one of its prompts must be in range.
    prompt_outlier_frac: 0.01
