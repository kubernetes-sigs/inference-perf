load:
  type: concurrent
  num_workers: 8
  worker_max_concurrency: 1000
  stages:
  - num_requests: 100
    concurrency_level: 5
  - num_requests: 200
    concurrency_level: 10
  - num_requests: 400
    concurrency_level: 20
  - num_requests: 600
    concurrency_level: 30
  - num_requests: 800
    concurrency_level: 40
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-Coder-480B-A35B-Instruct
  base_url: http://localhost:8000
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    max_model_len: 262144 # Update based on the model's context length
    num_conversations: 40
    shared_system_prompt_len: 3000
    dynamic_system_prompt_len: "Min(Max(LogNormal(11.412, 1.068), 10000), 990000)"
    turns_per_conversation: "Min(Max(LogNormal(1.792, 3), 1), 3000)"
    input_tokens_per_turn: "Min(Max(LogNormal(7.066, 0.703), 100), 10000)"
    output_tokens_per_turn: "Min(Max(LogNormal(5.271, 1.25), 50), 10000)"
    tool_call_latency_sec: "Min(Max(LogNormal(1.373, 1.634), 1), 100)"
