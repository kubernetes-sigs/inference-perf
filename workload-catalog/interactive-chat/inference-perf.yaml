load:
  type: concurrent
  stages:
  - num_requests: 300
    concurrency_level: 10
  - num_requests: 300
    concurrency_level: 20
  - num_requests: 300
    concurrency_level: 30
  - num_requests: 300
    concurrency_level: 40
  - num_requests: 300
    concurrency_level: 50
  num_workers: 1
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: google/gemma-3-1b-it
  base_url: http://localhost:8000
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    num_conversations: 50
    shared_system_prompt_len: 1000
    dynamic_system_prompt_len: "Min(Max(LogNormal(8.129, 0.574), 500), 15000)"
    turns_per_conversation: "Min(Max(LogNormal(1.221, 0.574), 1), 15)"
    input_tokens_per_turn: "Min(Max(LogNormal(3.665, 0.703), 10), 1000)"
    output_tokens_per_turn: "Min(Max(Normal(300, 150), 10), 1000)"
    tool_call_latency_sec: "Min(Max(LogNormal(3.516, 0.763), 5), 300)"
