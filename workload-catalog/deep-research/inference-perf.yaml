load:
  type: concurrent
  stages:
  - num_requests: 50
    concurrency_level: 1
  - num_requests: 50
    concurrency_level: 2
  - num_requests: 50
    concurrency_level: 3
  - num_requests: 50
    concurrency_level: 4
  - num_requests: 50
    concurrency_level: 5
  num_workers: 1
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: google/gemma-3-1b-it
  base_url: http://localhost:8000
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    num_conversations: 5
    shared_system_prompt_len: 2000
    dynamic_system_prompt_len: "Min(Max(LogNormal(10.478, 0.688), 2000), 150000)"
    turns_per_conversation: "Min(Max(Normal(15, 8.5), 2), 50)"
    input_tokens_per_turn: "Min(Max(LogNormal(7.743, 0.726), 500), 15000)"
    output_tokens_per_turn: "Min(Max(Normal(300, 850), 50), 4000)"
    tool_call_latency_sec: "Min(Max(Normal(25, 12), 5), 60)"
