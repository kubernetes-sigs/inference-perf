load:
  type: trace_session_replay
  stages:
  - num_sessions: 50
    concurrent_sessions: 5
  - num_sessions: 100
    concurrent_sessions: 10
  - num_sessions: 200
    concurrent_sessions: 20
  - num_sessions: 300
    concurrent_sessions: 30
  - num_sessions: 400
    concurrent_sessions: 40
  num_workers: 4
  worker_max_concurrency: 4000
  base_seed: 42
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen2.5-72B-Instruct
  base_url: http://localhost:8000
data:
  type: otel_trace_replay
  otel_trace_replay:
    hf_dataset_path: Exgentic/agent-llm-traces-v2
    use_static_model: true
    static_model_name: Qwen/Qwen2.5-72B-Instruct
    include_errors: false
    skip_invalid_files: true
    # The live server can emit tool_calls whose `arguments` is not valid JSON (vLLM's
    # tool-call parsers leak markup into the JSON string). The response itself still
    # returns 200, but feeding those bytes back on the next turn makes the chat
    # template's json.loads() raise and the server returns 400, cancelling the rest of
    # the session. Weaker models hit this more often than the frontier models the corpus
    # was recorded from. Substitute the recorded assistant message at those slots.
    bad_tool_call_handling: use_recorded
    # Keep only sessions whose largest call fits the served context window.
    # Qwen2.5-72B-Instruct serves 32k natively (max_position_embeddings=32768, no
    # rope_scaling); tool-call events add up to 4096 completion tokens on top of the
    # input, so cap the input below 32k. Raise to 120000 only if you serve 128k
    # (YaRN enabled) — check `GET /v1/models` for max_model_len.
    filter: "lambda x: x.get('max_tokens', 0) < 28000"
