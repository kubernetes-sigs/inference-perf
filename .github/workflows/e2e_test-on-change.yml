name: E2E Test on change

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      # Real-server oracle for the live-tier slice (e2e/tests/test_vllm_cpu_*.py):
      # CPU mode changes generation speed, not token accounting, so a plain
      # runner can check our numbers against a real vLLM's tokenizer, usage
      # accounting, and /metrics exposition. Bumping this pin is the moment
      # upstream drift (renamed metrics, changed accounting) surfaces in those
      # tests. If the server cannot be started the tests skip, so the sim-based
      # suite still gates on its own.
      VLLM_IMAGE: docker.io/vllm/vllm-openai-cpu:v0.26.0-x86_64
      VLLM_MODEL: facebook/opt-125m
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache model weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/hf-cache
          key: hf-${{ env.VLLM_MODEL }}

      # Started first so the image pull, model download, and warmup overlap
      # with the Nix and dependency installation below. Failure is a warning,
      # not an error: the live-oracle tests skip without a server.
      - name: Start vLLM (CPU mode)
        run: |
          mkdir -p "$HOME/hf-cache"
          # shm-size/seccomp/SYS_NICE are the invocation vLLM's CPU docs
          # prescribe: the engine's IPC lives in /dev/shm (docker's 64MB
          # default kills the worker during startup) and thread binding
          # wants SYS_NICE. KV cache is sized for a 16GB hosted runner.
          docker run -d --name vllm-cpu \
            --shm-size=4g \
            --security-opt seccomp=unconfined \
            --cap-add SYS_NICE \
            -p 8000:8000 \
            -v "$HOME/hf-cache:/root/.cache/huggingface" \
            -v "$PWD/e2e/testdata/simple_chat_template.jinja:/simple_chat_template.jinja" \
            -e VLLM_CPU_KVCACHE_SPACE=2 \
            "$VLLM_IMAGE" \
            "$VLLM_MODEL" \
            --max-model-len 2048 \
            --chat-template /simple_chat_template.jinja \
            --override-generation-config '{"temperature": 0}' \
            --enforce-eager \
          || echo "::warning::vLLM CPU container failed to start; live-oracle e2e tests will skip"

      - name: Install Nix
        uses: cachix/install-nix-action@4eae8bea4afaa8f8ea8aa638ab9a7fead2f3d21e # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          nix develop -c pdm sync -d

      # Exports E2E_VLLM_BASE_URL only if the server came up; otherwise the
      # live-oracle tests skip exactly as they do for a local run without vLLM.
      - name: Wait for vLLM
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "E2E_VLLM_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=vllm-cpu)" ]; then
              break
            fi
            sleep 5
          done
          echo "::warning::vLLM CPU server not healthy; live-oracle e2e tests will skip"
          docker logs vllm-cpu 2>&1 | tail -50 || true

      - name: Run end-to-end tests
        run: |
          set -euxo pipefail
          nix develop -c pdm run test:e2e -o log_cli_level=DEBUG |& tee test_e2e.out

      - name: vLLM server logs on failure
        if: failure()
        run: docker logs vllm-cpu || true

      - name: Upload test_e2e.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test_e2e
          path: test_e2e.out
