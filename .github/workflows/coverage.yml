# The workflow name is load-bearing: merge_gate.yml keys on it, in both its
# workflow_run trigger and its REQUIRED_WORKFLOWS list. Rename in lockstep.
name: Code Coverage

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '**/*.md'
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Important: need full history to checkout 'main'
      # The workflow runs on every PR (no paths filter) so the Merge Gate
      # workflow always sees a completed Code Coverage run, but coverage
      # itself is skipped as a no-op when only markdown files changed.
      - name: Check for non-markdown changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qv '\.md$'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "Only markdown files changed; skipping coverage."
            fi
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.changes.outputs.code == 'true'
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up PDM
        if: steps.changes.outputs.code == 'true'
        uses: pdm-project/setup-pdm@c6081998a653693a457d93c70b8007d979bc6741 # v4
        with:
          python-version: ${{ matrix.python-version }}
      # Same key as Unit Tests (same install set), so the two workflows share
      # one cache. Keyed on the exact interpreter version because the venv
      # symlinks into the runner's hostedtoolcache.
      - name: Restore pdm venv
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-dev-analysis-otel-${{ hashFiles('pdm.lock') }}
      # Kept on cache hits: pdm sync verifies the restored venv against
      # pdm.lock in seconds and repairs a partial restore.
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          pdm sync -d -G analysis -G otel
      - name: Run coverage regression check
        if: steps.changes.outputs.code == 'true'
        run: pdm run check:cov
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage.xml
            coverage.lcov
          if-no-files-found: warn
      # Coveralls renders the README coverage badge. It authenticates with the
      # built-in GITHUB_TOKEN, so this needs no repository secret and no push
      # access to any branch (the job stays at contents: read). Restricted to
      # push-on-main so the badge tracks main and forked PRs, whose token is
      # read-only, never attempt an upload.
      - name: Send coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
