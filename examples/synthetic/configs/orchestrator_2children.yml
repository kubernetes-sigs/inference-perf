# Orchestrator pattern: root spawns EXACTLY 2 sub-agents in parallel, waits (merge), then continues.
api: {type: chat, streaming: false}
data:
  type: synthetic_agent_sessions
  synthetic_agent_sessions:
    num_sessions: 3
    seed: 100
    theme_mix: {generic: 1.0}
    rounds_per_session: {type: fixed, mean: 1}       # one orchestration round
    fanout_probability: 1.0                            # always spawn
    sub_agents_per_spawn: {type: fixed, mean: 2}       # EXACTLY 2 children
    max_depth: 1                                        # children are leaves (no further nesting)
    tool_turns_per_loop: {type: fixed, mean: 0}        # children answer directly → each = 1 clean call
    tool_definitions_per_agent: {type: fixed, mean: 4}
    max_events_per_session: 512
    input_tokens_per_turn:  {type: fixed, mean: 120}
    output_tokens_per_turn: {type: fixed, mean: 40}
    tool_call_latency_sec:  {type: fixed, mean: 0}     # no artificial gap → the 2 children truly overlap
load:
  type: trace_session_replay
  stages: [{concurrent_sessions: 1}]                   # 1 session → ANY overlap is intra-session (the 2 children)
  worker_max_concurrency: 20
server: {type: vllm, base_url: "http://localhost:8000", model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"}
storage: {local_storage: {path: "reports-synthetic-orch"}}
report: {request_lifecycle: {summary: true, per_stage: true}}
