# DEMO 04 — Interactive multi-round conversation (N>1 human turns, growing context).
# 3 rounds; each round the "user" follows up and the conversation transcript GROWS
# (round K carries rounds 0..K-1 as context). user_think_time_sec spaces the human turns.
# WHAT TO LOOK FOR: per-round prompt token counts INCREASE across rounds (accumulating context);
# 9 events/session (3 rounds x [principal + 1 tool turn + answer]).
api: {type: chat, streaming: false}
data:
  type: synthetic_agent_sessions
  synthetic_agent_sessions:
    num_sessions: 4
    seed: 4
    theme_mix: {generic: 1.0}
    rounds_per_session: {type: fixed, mean: 3}     # 3 human turns
    fanout_probability: 0.0
    tool_turns_per_loop: {type: fixed, mean: 1}
    tool_definitions_per_agent: {type: fixed, mean: 6}
    input_tokens_per_turn:  {type: fixed, mean: 250}
    output_tokens_per_turn: {type: fixed, mean: 60}
    tool_call_latency_sec:  {type: fixed, mean: 1}
    user_think_time_sec:    {type: fixed, mean: 2}   # gap before each follow-up
load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 2
  worker_max_concurrency: 20
  base_seed: 42

server:
  type: vllm
  base_url: "http://localhost:8000"        # <-- point at your vLLM
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"  # <-- swap for your model later

storage:
  local_storage: {path: "reports-demo-04-interactive"}
report:
  request_lifecycle: {summary: true, per_stage: true}
