# DEMO 06 — Orchestrator fan-out: spawn 2 sub-agents in PARALLEL, wait for both, then continue.
# The headline multi-agent capability. depth=1 (children are leaves). children answer directly.
# WHAT TO LOOK FOR: within a session the 2 sub-agent LLM calls run concurrently (overlapping in
# time / peak-2 in-flight); a merge waits for both; then the orchestrator's final answer.
api: {type: chat, streaming: false}
data:
  type: synthetic_agent_sessions
  synthetic_agent_sessions:
    num_sessions: 4
    seed: 6
    theme_mix: {generic: 1.0}
    rounds_per_session: {type: fixed, mean: 1}
    fanout_probability: 1.0                            # always spawn
    sub_agents_per_spawn: {type: fixed, mean: 2}       # exactly 2 children
    max_depth: 1                                        # children don't recurse
    tool_turns_per_loop: {type: fixed, mean: 0}        # children answer directly
    tool_definitions_per_agent: {type: fixed, mean: 6}
    max_events_per_session: 512
    input_tokens_per_turn:  {type: fixed, mean: 250}
    output_tokens_per_turn: {type: fixed, mean: 60}
    tool_call_latency_sec:  {type: fixed, mean: 0}     # no gap -> children truly overlap
load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 3
  worker_max_concurrency: 20
  base_seed: 42

server:
  type: vllm
  base_url: "http://localhost:8000"        # <-- point at your vLLM
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"  # <-- swap for your model later

storage:
  local_storage: {path: "reports-demo-06-orchestrator"}
report:
  request_lifecycle: {summary: true, per_stage: true}
