# Realistic-scale agentic load — matched to REAL Exgentic profile (median ~114K-token prompts,
# ~487-tool catalog, ~1 tool-call/turn). Use this to stress prefill/KV-cache like real agent traffic;
# the *_smoke configs demonstrate SHAPES at tiny scale, this one demonstrates SCALE.
api: {type: chat, streaming: false}
data:
  type: synthetic_agentic
  synthetic_agentic:
    num_sessions: 20
    seed: 42
    theme_mix: {generic: 1.0}
    turns_per_session: {type: uniform, min: 1, max: 3}
    fanout_probability: 0.3
    sub_agents_per_spawn: {type: uniform, min: 2, max: 3}
    max_depth: 2
    tool_loop_depth: {type: uniform, min: 1, max: 4}
    tool_catalog_size_per_agent: {type: fixed, mean: 487}   # matches real Exgentic catalog size
    parallel_tool_calls_per_step: {type: fixed, mean: 1}    # matches real: ~97% single-call
    input_tokens_per_turn:  {type: lognormal, min: 300, mean: 110000, max: 160000, std_dev: 30000}  # real median ~114K
    output_tokens_per_turn: {type: lognormal, min: 5, mean: 210, max: 3600, std_dev: 300}            # real median ~206
    tool_call_latency_sec:  {type: fixed, mean: 1}
    max_events_per_session: 512
load:
  type: trace_session_replay
  stages: [{concurrent_sessions: 4}]
  worker_max_concurrency: 100
server: {type: vllm, base_url: "http://localhost:8000", model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"}
storage: {local_storage: {path: "reports-synthetic-realistic"}}
report: {request_lifecycle: {summary: true, per_stage: true}}
