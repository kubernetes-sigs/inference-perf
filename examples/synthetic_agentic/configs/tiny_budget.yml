api: {type: chat, streaming: false}
data:
  type: synthetic_agentic
  synthetic_agentic:
    num_sessions: 4
    seed: 8
    theme_mix: {generic: 1.0}
    turns_per_session: {type: fixed, mean: 1}
    fanout_probability: 1.0
    sub_agents_per_spawn: {type: fixed, mean: 3}
    max_depth: 3
    tool_loop_depth: {type: fixed, mean: 2}
    tool_catalog_size_per_agent: {type: fixed, mean: 5}
    max_events_per_session: 10          # TINY — forces truncation-to-leaf
    input_tokens_per_turn:  {type: fixed, mean: 80}
    output_tokens_per_turn: {type: fixed, mean: 30}
    tool_call_latency_sec:  {type: fixed, mean: 0}
load: {type: trace_session_replay, stages: [{concurrent_sessions: 2}], worker_max_concurrency: 20}
server: {type: vllm, base_url: "http://localhost:8000", model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"}
storage: {local_storage: {path: "reports-synthetic-tiny"}}
report: {request_lifecycle: {summary: true}}
