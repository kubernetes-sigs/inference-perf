# Synthetic agent sessions — recursive fan-out (exercises tool_output merge live)
api:
  type: chat
  streaming: false

data:
  type: synthetic_agent_sessions
  synthetic_agent_sessions:
    num_sessions: 5
    seed: 7
    theme_mix: {generic: 1.0}
    rounds_per_session: {type: fixed, mean: 1}
    fanout_probability: 1.0                          # always spawn
    sub_agents_per_spawn: {type: fixed, mean: 2}     # K=2 children
    max_depth: 2                                      # recursion allowed
    tool_turns_per_loop: {type: fixed, mean: 1}
    tool_definitions_per_agent: {type: fixed, mean: 6}
    max_events_per_session: 2048                      # big budget so fan-out isn't truncated
    input_tokens_per_turn:  {type: fixed, mean: 200}
    output_tokens_per_turn: {type: fixed, mean: 60}
    tool_call_latency_sec:  {type: fixed, mean: 1}

load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 2
  worker_max_concurrency: 20

server:
  type: vllm
  base_url: "http://localhost:8000"
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"

storage:
  local_storage:
    path: "reports-synthetic-fanout"

report:
  request_lifecycle:
    summary: true
    per_stage: true
