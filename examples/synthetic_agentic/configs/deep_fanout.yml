api: {type: chat, streaming: false}
data:
  type: synthetic_agent_sessions
  synthetic_agent_sessions:
    num_sessions: 3
    seed: 5
    theme_mix: {db2_latency_incident: 1.0}
    rounds_per_session: {type: fixed, mean: 1}
    fanout_probability: 1.0
    sub_agents_per_spawn: {type: fixed, mean: 2}
    max_depth: 3
    tool_turns_per_loop: {type: fixed, mean: 1}
    tool_definitions_per_agent: {type: fixed, mean: 6}
    max_events_per_session: 4096
    input_tokens_per_turn:  {type: fixed, mean: 100}
    output_tokens_per_turn: {type: fixed, mean: 40}
    tool_call_latency_sec:  {type: fixed, mean: 0}
load: {type: trace_session_replay, stages: [{concurrent_sessions: 3}], worker_max_concurrency: 40}
server: {type: vllm, base_url: "http://localhost:8000", model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"}
storage: {local_storage: {path: "reports-synthetic-deep"}}
report: {request_lifecycle: {summary: true}}
