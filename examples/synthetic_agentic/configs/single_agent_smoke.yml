# Synthetic agent sessions — single-agent tool-loop smoke test (no fan-out)
api:
  type: chat
  streaming: false

data:
  type: synthetic_agentic
  synthetic_agentic:
    num_sessions: 5
    seed: 42
    theme_mix: {generic: 1.0}
    rounds_per_session: {type: fixed, mean: 1}     # autonomous
    fanout_probability: 0.0                          # single agent
    tool_turns_per_loop: {type: fixed, mean: 2}      # 2 tool turns then answer
    tool_definitions_per_agent: {type: fixed, mean: 6}
    input_tokens_per_turn:  {type: fixed, mean: 200}
    output_tokens_per_turn: {type: fixed, mean: 80}
    tool_call_latency_sec:  {type: fixed, mean: 1}

load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 2
  worker_max_concurrency: 20

server:
  type: vllm
  base_url: "http://localhost:8000"
  model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"

storage:
  local_storage:
    path: "reports-synthetic-smoke"

report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
