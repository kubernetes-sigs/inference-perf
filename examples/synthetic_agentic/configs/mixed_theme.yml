api: {type: chat, streaming: false}
data:
  type: synthetic_agentic
  synthetic_agentic:
    num_sessions: 6
    seed: 21
    theme_mix: {generic: 0.5, db2_latency_incident: 0.5}
    rounds_per_session: {type: fixed, mean: 1}
    fanout_probability: 0.5
    sub_agents_per_spawn: {type: uniform, min: 2, max: 3}
    max_depth: 2
    tool_turns_per_loop: {type: uniform, min: 0, max: 2}
    tool_definitions_per_agent: {type: fixed, mean: 8}
    max_events_per_session: 512
    input_tokens_per_turn:  {type: fixed, mean: 200}
    output_tokens_per_turn: {type: fixed, mean: 50}
    tool_call_latency_sec:  {type: fixed, mean: 1}
load:
  type: trace_session_replay
  stages: [{concurrent_sessions: 2}]
  worker_max_concurrency: 20
server: {type: vllm, base_url: "http://localhost:8000", model_name: "HuggingFaceTB/SmolLM2-135M-Instruct"}
storage: {local_storage: {path: "reports-synthetic-mixed"}}
report: {request_lifecycle: {summary: true, per_stage: true}}
