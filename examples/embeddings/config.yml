# Example config for benchmarking the embeddings API (POST /v1/embeddings).
# See README.md in this directory for how to run it and sweep batch sizes.

load:
  type: concurrent
  stages:
  - concurrency_level: 8
    num_requests: 400

api:
  type: embeddings
  embeddings:
    batch_size: 16            # Input strings per request

server:
  type: vllm
  model_name: BAAI/bge-small-en-v1.5
  base_url: http://0.0.0.0:8000

tokenizer:
  pretrained_model_name_or_path: BAAI/bge-small-en-v1.5

data:
  type: synthetic
  input_distribution:         # Length in tokens of each input string
    min: 20
    max: 400
    mean: 128
    std_dev: 64
  # No output_distribution: embeddings requests generate no output.

report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
