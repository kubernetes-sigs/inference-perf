load:
  type: constant
  stages:
  - rate: 1
    duration: 30
api: 
  type: completion
server:
  type: tgi
  model_name: HuggingFaceTB/SmolLM2-135M-Instruct
  base_url: http://0.0.0.0:8000
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: HuggingFaceTB/SmolLM2-135M-Instruct
data:
  type: random
  input_distribution: "Min(Max(Normal(50, 10), 10), 100)"  # min length of the synthetic prompts; max length of the synthetic prompts; mean length of the synthetic prompts; standard deviation of the length of the synthetic prompts
  output_distribution: "Min(Max(Normal(50, 10), 10), 100)"  # min length of the output to be generated; max length of the output to be generated; mean length of the output to be generated; standard deviation of the length of the output to be generated
metrics:
  type: prometheus
  prometheus:
    url: http://localhost:9090
    scrape_interval: 15
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true